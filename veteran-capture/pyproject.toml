[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veteran-capture"
version = "0.1.0"
description = "Active capture of tacit driver knowledge for the Damm Smart Truck briefing LLM."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Damm Smart Truck Team" }]
license = { text = "Proprietary" }

dependencies = [
    "anthropic>=0.69.0",
    "fastapi>=0.118.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.4",
    "openai>=1.50.0",
    "pandas>=2.2.3",
    "pyarrow>=18.0.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
    "types-python-dateutil",
]

[project.scripts]
veteran-capture = "veteran_capture.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/veteran_capture"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "N",    # pep8-naming
    "PL",   # pylint subset
]
ignore = [
    "E501",     # line length (we use formatter)
    "PLR0913",  # too many args (acceptable in config)
    "PLR2004",  # magic value (sometimes ok in tests)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
