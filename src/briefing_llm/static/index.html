<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Briefing — Damm DDI</title>
  <style>
    :root {
      --damm-red: #e30613;
      --bg: #0e0e10;
      --fg: #f5f5f7;
      --muted: #9b9ba1;
      --card: #1a1a1f;
      --card-alt: #15151a;
      --border: #2a2a31;
      --ok: #36b37e;
      --warn: #ff8b00;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
    }

    main { max-width: 1080px; margin: 0 auto; padding: 28px 24px 80px; }

    .badge-brand {
      display: inline-block;
      background: var(--damm-red);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 { font-size: 26px; line-height: 1.2; margin: 14px 0 4px; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }

    .card h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-bottom: 16px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control-group label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    select {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      background: var(--card-alt);
      color: var(--fg);
      min-width: 180px;
    }
    select:focus { outline: none; border-color: var(--damm-red); }
    select option { background: var(--card-alt); color: var(--fg); }

    .table-wrap {
      max-height: 460px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-alt);
    }

    .route-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .route-table th {
      text-align: left;
      padding: 10px 12px;
      background: #15151a;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .route-table td {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      vertical-align: top;
    }

    .route-table tr { cursor: pointer; transition: background 0.1s; }
    .route-table tr:hover { background: rgba(227, 6, 19, 0.06); }
    .route-table tr.selected { background: rgba(227, 6, 19, 0.14); }
    .route-table tr.no-tips { opacity: 0.55; }

    .route-id { font-weight: 600; font-variant-numeric: tabular-nums; }

    .client-list { display: flex; flex-wrap: wrap; gap: 4px; }

    .client-tag {
      display: inline-block;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 4px;
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .client-tag.has-tips {
      background: rgba(54, 179, 126, 0.12);
      color: var(--ok);
      border-color: rgba(54, 179, 126, 0.4);
      font-weight: 600;
    }

    .tips-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(54, 179, 126, 0.18);
      color: var(--ok);
      min-width: 22px;
      text-align: center;
    }

    .tips-badge.zero {
      background: transparent;
      color: var(--muted);
      font-weight: 400;
      border: 1px dashed var(--border);
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
    }

    button {
      padding: 9px 18px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--damm-red);
      color: #fff;
      border-color: var(--damm-red);
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.92; }
    .btn-primary:disabled {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--fg);
      border-color: var(--border);
    }
    .btn-secondary:hover { border-color: var(--damm-red); }

    .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--damm-red);
      border-radius: 50%;
      animation: spin 0.5s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #result { display: none; }

    .briefing-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .briefing-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .badge {
      font-size: 11px;
      text-transform: uppercase;
      background: rgba(227, 6, 19, 0.18);
      color: var(--damm-red);
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .briefing-body {
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      color: var(--fg);
    }
    .briefing-body strong { color: var(--fg); }
    .briefing-body hr { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; }

    .error-msg {
      background: rgba(227, 6, 19, 0.1);
      color: var(--damm-red);
      border: 1px solid rgba(227, 6, 19, 0.4);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      margin-bottom: 14px;
    }

    .empty-state {
      text-align: center;
      padding: 28px 12px;
      color: var(--muted);
      font-size: 13px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 36px;
    }
    footer a { color: var(--damm-red); text-decoration: none; }

    @media print {
      :root {
        --bg: #fff;
        --fg: #1a1a1a;
        --muted: #555;
        --card: #fff;
        --card-alt: #fff;
        --border: #ddd;
      }
      html, body { background: #fff; color: #1a1a1a; }
      .badge-brand { background: #000; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      #input-section { display: none !important; }
      #result { display: block !important; }
      .btn-secondary, .actions { display: none !important; }
      main { max-width: 100%; padding: 12px; }
      .card { border: 1px solid #ddd; box-shadow: none; }
      .briefing-body { color: #1a1a1a; }
      .badge { background: #000; color: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<main>

  <div class="badge-brand">Damm &middot; DDI &middot; Driver Briefing</div>
  <h1>Driver briefing</h1>
  <div class="subtitle">Pick a date, choose a truck, and generate the compact route briefing the driver receives. Tips come from the veteran-capture knowledge base.</div>

  <div class="card" id="input-section">
    <h2>Route picker</h2>
    <div class="controls">
      <div class="control-group">
        <label for="date-select">Date</label>
        <select id="date-select" onchange="onDateChange()">
          <option value="">Loading...</option>
        </select>
      </div>
      <div class="control-group">
        <label for="language">Language</label>
        <select id="language">
          <option value="es">Castellano</option>
          <option value="ca">Catala</option>
        </select>
      </div>
    </div>

    <div id="route-area">
      <div class="empty-state">Select a date.</div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="btn-generate" onclick="generateBriefing()" disabled>Generate briefing</button>
      <div class="spinner" id="spinner"></div>
    </div>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <div class="card" id="result">
    <div class="briefing-header">
      <span class="briefing-title" id="res-route"></span>
      <span class="badge" id="res-lang"></span>
    </div>
    <div class="briefing-body" id="res-briefing"></div>
    <div class="actions" style="justify-content: flex-end;">
      <button class="btn-secondary" onclick="window.print()">Print</button>
    </div>
  </div>

  <footer>
    Damm Smart Truck &middot; reads <a href="/dataset/veteran_notes/manifest.json" target="_blank">manifest.json</a> from veteran-capture.
  </footer>

</main>

<script>
var selectedRouteId = null;

async function loadDates() {
  var sel = document.getElementById("date-select");
  try {
    var resp = await fetch("/dates");
    var dates = await resp.json();
    sel.innerHTML = '<option value="">-- Select date --</option>';
    dates.forEach(function(d) {
      sel.appendChild(new Option(d, d));
    });
  } catch (e) {
    sel.innerHTML = '<option value="">Error</option>';
  }
}

async function onDateChange() {
  var date = document.getElementById("date-select").value;
  var area = document.getElementById("route-area");
  selectedRouteId = null;
  document.getElementById("btn-generate").disabled = true;

  if (!date) {
    area.innerHTML = '<div class="empty-state">Select a date.</div>';
    return;
  }

  area.innerHTML = '<div class="empty-state">Loading...</div>';

  try {
    var resp = await fetch("/routes/" + date);
    var routes = await resp.json();
  } catch (e) {
    area.innerHTML = '<div class="empty-state">Error loading routes.</div>';
    return;
  }

  if (routes.length === 0) {
    area.innerHTML = '<div class="empty-state">No routes for this date.</div>';
    return;
  }

  routes.sort(function(a, b) { return b.tips_count - a.tips_count; });

  var html = '<div class="table-wrap"><table class="route-table">';
  html += '<thead><tr><th>Truck</th><th>Stops</th><th>Tips</th><th>Clients</th></tr></thead><tbody>';

  routes.forEach(function(r) {
    var rowClass = r.tips_count === 0 ? 'no-tips' : '';
    var badgeClass = r.tips_count === 0 ? 'tips-badge zero' : 'tips-badge';

    var clients = '';
    r.clients.forEach(function(c) {
      var cls = c.has_tips ? 'client-tag has-tips' : 'client-tag';
      clients += '<span class="' + cls + '">' + esc(c.name) + '</span>';
    });

    html += '<tr class="' + rowClass + '" data-route="' + r.route_id + '">' +
      '<td class="route-id">Truck ' + esc(r.route_id) + '</td>' +
      '<td>' + r.num_stops + '</td>' +
      '<td><span class="' + badgeClass + '">' + r.tips_count + '</span></td>' +
      '<td><div class="client-list">' + clients + '</div></td>' +
      '</tr>';
  });

  html += '</tbody></table></div>';
  area.innerHTML = html;

  area.querySelectorAll("tr[data-route]").forEach(function(tr) {
    tr.addEventListener("click", function() {
      area.querySelectorAll("tr").forEach(function(r) { r.classList.remove("selected"); });
      tr.classList.add("selected");
      selectedRouteId = tr.dataset.route;
      document.getElementById("btn-generate").disabled = false;
    });
  });
}

function esc(s) {
  var d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function showError(msg) {
  var el = document.getElementById("error-msg");
  el.textContent = msg;
  el.style.display = "block";
}

function hideError() { document.getElementById("error-msg").style.display = "none"; }

function formatBriefing(text) {
  var h = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/^---$/gm, "<hr>");
  h = h.replace(/^- (.+)$/gm, function(_, c) {
    return "<span style='display:block;padding-left:1em;text-indent:-1em;margin:0.1rem 0'>&bull; " + c + "</span>";
  });
  return h;
}

async function generateBriefing() {
  hideError();
  if (!selectedRouteId) return;

  var date = document.getElementById("date-select").value;
  var language = document.getElementById("language").value;
  var btn = document.getElementById("btn-generate");
  var spinner = document.getElementById("spinner");
  btn.disabled = true;
  spinner.style.display = "block";
  document.getElementById("result").style.display = "none";

  try {
    var resp = await fetch("/briefing", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ route_date: date, route_id: selectedRouteId, language: language })
    });
    var data = await resp.json();
    if (!resp.ok) { showError(data.detail || "Server error"); return; }

    document.getElementById("res-route").textContent = "Truck " + data.route_id + " -- " + date;
    document.getElementById("res-lang").textContent = data.language === "es" ? "Castellano" : "Catala";
    document.getElementById("res-briefing").innerHTML = formatBriefing(data.briefing);
    document.getElementById("result").style.display = "block";
  } catch (e) {
    showError("Connection error: " + e.message);
  } finally {
    btn.disabled = false;
    spinner.style.display = "none";
  }
}

loadDates();
</script>

</body>
</html>
